# Red teams the agent every week (evals/red_team.py): new attacks from Microsoft's AI Red Teaming Agent, against
# the code on main. Successful attacks come back as draft eval cases, in the run's "red-team" artifact.
name: Red team

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Evals and the red team share the agent's model deployment (10,000 tokens/min): run one at a time, or both get
# throttled and the evals fail for the wrong reason. A second run waits instead.
concurrency:
  group: agent-model-quota
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-latest
    if: vars.AZURE_AI_PROJECT_ENDPOINT != '' # skipped until the Foundry project exists and the variable is set
    timeout-minutes: 60
    env:
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      AZURE_OPENAI_JUDGE_DEPLOYMENT: ${{ vars.AZURE_OPENAI_JUDGE_DEPLOYMENT }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      AZURE_COSMOS_ENDPOINT: ${{ vars.AZURE_COSMOS_ENDPOINT }}
      CONTENT_SAFETY_ENDPOINT: ${{ vars.CONTENT_SAFETY_ENDPOINT }}
      AUTH_TENANT_ID: ${{ vars.AUTH_TENANT_ID }}
      AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # PyRIT doesn't support 3.14 yet
          cache: pip
      - run: pip install -r requirements.txt -r evals/requirements.txt -r evals/requirements-redteam.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python -m evals.red_team
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-team
          path: |
            evals/results/
            evals/candidates.yaml
          if-no-files-found: ignore
