# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: contoso-helpdesk
services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true # built in Azure Container Registry, so no local Docker needed
hooks:
  postprovision: # fill the search index once the infrastructure exists
    posix:
      shell: sh
      run: ./scripts/ingest.sh
